<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Clean Kids · v1.1.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#c9f2ff,#fff3ca);color:#17324a;min-height:100dvh}.app{width:min(980px,100%);margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{font-size:clamp(22px,4vw,32px);font-weight:950}.ver{font-size:12px;opacity:.55}.menuBtn{border:0;border-radius:16px;padding:10px 14px;background:#fff;font-weight:900;box-shadow:0 4px 0 #16324a22}.stage{position:relative;min-height:min(760px,calc(100dvh - 82px));border:4px solid #fff;border-radius:28px;overflow:hidden;background:linear-gradient(#bdefff 0 42%,#f7efd7 42%);box-shadow:0 15px 40px #2e668522}.sceneTitle{position:absolute;left:18px;top:16px;z-index:5;background:#fff;padding:9px 14px;border-radius:99px;font-weight:900}.world{position:absolute;inset:0 0 185px}.kid{position:absolute;left:50%;top:50%;transform:translate(-50%,-45%);font-size:150px;filter:drop-shadow(0 9px 6px #0002);transition:.4s}.germs{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:230px;height:230px;pointer-events:none}.germ{position:absolute;font-size:34px;animation:bob .7s alternate infinite}.germ:nth-child(1){left:10%;top:14%}.germ:nth-child(2){right:8%;top:30%;animation-delay:.2s}.germ:nth-child(3){left:25%;bottom:7%;animation-delay:.35s}.germ:nth-child(4){right:30%;bottom:12%;animation-delay:.5s}@keyframes bob{to{transform:translateY(-9px) rotate(8deg)}}.prop{position:absolute;font-size:78px;filter:drop-shadow(0 8px 5px #0002)}.leftProp{left:12%;top:45%}.rightProp{right:12%;top:45%}.tool{position:absolute;z-index:50;left:10%;bottom:12%;font-size:52px;background:#fff;border:4px solid #fff;border-radius:22px;padding:8px 14px;box-shadow:0 8px 18px #0002;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:none}.tool.show{display:block}.tool.dragging{transform:scale(1.08)}.panel{position:absolute;z-index:35;bottom:12px;left:50%;transform:translateX(-50%);width:min(94%,800px);background:#fffffff2;border-radius:24px;padding:14px;box-shadow:0 12px 32px #345f7a2b}.msg{text-align:center;font-weight:950;font-size:clamp(18px,3vw,23px)}.detail{text-align:center;font-weight:700;opacity:.8;margin:6px 0 10px}.bar{height:16px;border-radius:99px;background:#d8e7eb;overflow:hidden;margin:7px 0 12px}.bar div{height:100%;width:0;background:linear-gradient(90deg,#54baff,#66dc8b);transition:.2s}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:12px 16px;min-height:48px;font:inherit;font-weight:900;background:#fff;box-shadow:0 4px 0 #1d4e7122;touch-action:manipulation}.primary{background:#ffdb62}.good{background:#8ce3a3}.bad{background:#ffc2b7}.overlay{position:absolute;z-index:90;inset:0;background:#16324a55;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.card{width:min(620px,96%);max-height:86%;overflow:auto;background:#fff;border-radius:26px;padding:18px;box-shadow:0 16px 45px #0003}.card h2{text-align:center;margin:0 0 12px}.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.effect{background:#f3f7f9;border-radius:17px;padding:12px;text-align:center;font-weight:800}.effect b{display:block;font-size:32px;margin-bottom:5px}.episodes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ep{border:0;text-align:left;border-radius:18px;padding:13px;background:#f3f8fa;font:inherit;font-weight:850}.ep span{font-size:30px;display:block}.ep.active{outline:4px solid #7ddda0;background:#effff4}.stars{text-align:center;font-size:44px;margin:6px}.fly{position:absolute;z-index:30;font-size:34px;transition:1s cubic-bezier(.2,.8,.2,1);pointer-events:none}.clean .germ{opacity:0;transform:scale(.2);transition:.5s}.shake{animation:shake .35s 2}@keyframes shake{25%{transform:translate(-53%,-45%)}75%{transform:translate(-47%,-45%)}}@media(max-width:640px){.app{padding:0}.top{padding:9px 10px 0}.stage{border-left:0;border-right:0;border-bottom:0;border-radius:22px 22px 0 0;min-height:calc(100dvh - 66px)}.world{inset:0 0 205px}.kid{font-size:120px}.prop{font-size:58px}.leftProp{left:5%}.rightProp{right:5%}.tool{left:5%;bottom:25%}.effects,.episodes{grid-template-columns:1fr}.sceneTitle{top:10px;left:10px;font-size:13px}}
</style>
</head><body><main class="app"><div class="top"><div class="brand">🫧 Clean Kids <small class="ver">v1.1.0</small></div><button class="menuBtn" id="menuBtn">☰ Các tập</button></div>
<section class="stage" id="stage"><div class="sceneTitle" id="sceneTitle"></div><div class="world" id="world"><div class="prop leftProp" id="leftProp"></div><div class="kid" id="kid">🧒</div><div class="germs" id="germs"><i class="germ">🦠</i><i class="germ">🦠</i><i class="germ">🦠</i><i class="germ">🦠</i></div><div class="prop rightProp" id="rightProp"></div><div class="tool" id="tool"></div></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div class="panel"><div class="msg" id="msg"></div><div class="detail" id="detail"></div><div class="bar"><div id="fill"></div></div><div class="buttons" id="buttons"></div></div></section></main>
<script>
(()=>{
const VERSION='1.1.0';
const episodes=[
{id:1,icon:'🚿',title:'Tắm trước bữa tối',intro:'Bạn nhỏ vừa chơi ngoài sân về, người đầy mồ hôi và bụi.',bad:'Không tắm, ăn luôn',good:'Đi tắm trước',tool:'🧼',kid:'🧒',left:'⚽',right:'🍚',action:'Kéo xà phòng chà lên bạn nhỏ.',badTitle:'Nếu cứ để cơ thể bẩn?',badFx:[['🦠','Bụi bẩn và vi sinh vật vẫn bám trên da và tay.'],['😣','Mồ hôi + bụi có thể gây mùi, bí da hoặc khó chịu.'],['🍚','Tay bẩn chạm thức ăn có thể đưa mầm bệnh tới miệng.']],goodTitle:'Sau khi tắm sạch',goodFx:[['✨','Mồ hôi và bụi bẩn được rửa trôi.'],['🦠⬇️','Xà phòng và nước giúp giảm vi sinh vật bám ngoài da.'],['👕','Mặc đồ sạch và rửa tay trước ăn giúp bữa tối vệ sinh hơn.']]},
{id:2,icon:'👐',title:'Rửa tay trước khi ăn',intro:'Bạn nhỏ vừa chơi đồ chơi và sắp cầm bánh ăn.',bad:'Ăn ngay',good:'Rửa tay',tool:'🧼',kid:'🧒',left:'🧸',right:'🥪',action:'Kéo xà phòng qua bàn tay để tạo bọt và làm sạch.',badTitle:'Tay bẩn có thể mang gì?',badFx:[['🦠','Vi sinh vật từ đồ vật có thể bám trên tay.'],['🥪','Khi cầm thức ăn, chúng có thể chuyển sang thức ăn.'],['🤢','Đưa tay hoặc thức ăn bẩn lên miệng có thể làm tăng nguy cơ mắc bệnh.']],goodTitle:'Rửa tay đúng cách',goodFx:[['💧','Làm ướt tay bằng nước sạch.'],['🧼','Chà xà phòng lòng bàn tay, mu tay, kẽ ngón và đầu ngón.'],['⏱️','Chà khoảng 20 giây rồi xả sạch và lau khô.']]},
{id:3,icon:'🪥',title:'Đánh răng trước khi ngủ',intro:'Đã ăn tối xong và sắp đi ngủ, nhưng răng còn thức ăn bám lại.',bad:'Ngủ luôn',good:'Đánh răng',tool:'🪥',kid:'😁',left:'🍬',right:'🛏️',action:'Kéo bàn chải qua vùng miệng để làm sạch răng.',badTitle:'Nếu không đánh răng?',badFx:[['🍬','Mảng bám và đường từ thức ăn còn trên răng.'],['🦠','Vi khuẩn trong mảng bám tạo axit làm hại men răng.'],['🦷','Lâu ngày tăng nguy cơ sâu răng và viêm nướu.']],goodTitle:'Sau khi đánh răng',goodFx:[['🪥','Chải nhẹ mặt ngoài, mặt trong và mặt nhai.'],['⏱️','Đánh răng khoảng 2 phút với kem chứa fluoride phù hợp.'],['🌙','Đánh răng trước khi ngủ là thói quen rất quan trọng.']]},
{id:4,icon:'🤧',title:'Che miệng khi ho, hắt hơi',intro:'Bạn nhỏ sắp hắt hơi khi đang đứng gần bạn bè.',bad:'Hắt hơi tự do',good:'Che đúng cách',tool:'💪',kid:'🤧',left:'🧒',right:'🧒',action:'Kéo khuỷu tay lên gần miệng để che khi ho/hắt hơi.',badTitle:'Nếu không che miệng?',badFx:[['💨','Giọt bắn có thể bay ra xung quanh.'],['🦠','Nếu đang nhiễm bệnh, giọt bắn có thể mang mầm bệnh.'],['👫','Người ở gần hoặc bề mặt xung quanh có thể bị phơi nhiễm.']],goodTitle:'Che đúng cách',goodFx:[['💪','Ho/hắt hơi vào khuỷu tay áo thay vì bàn tay.'],['🧻','Nếu dùng khăn giấy, bỏ ngay vào thùng rác.'],['👐','Rửa tay sau khi ho/hắt hơi hoặc chạm dịch tiết.']]},
{id:5,icon:'🍪',title:'Không ăn đồ rơi xuống đất',intro:'Chiếc bánh vừa rơi xuống sàn. Bạn nhỏ rất tiếc và muốn nhặt lên ăn.',bad:'Nhặt ăn luôn',good:'Bỏ đi',tool:'🗑️',kid:'🧒',left:'🍪',right:'🗑️',action:'Kéo chiếc bánh bẩn về phía thùng rác.',badTitle:'Đồ ăn rơi xuống sàn thì sao?',badFx:[['🦠','Sàn nhà có thể có bụi và vi sinh vật không nhìn thấy.'],['🍪','Vi sinh vật có thể chuyển sang thức ăn ngay khi tiếp xúc.'],['🤢','Ăn thức ăn nhiễm bẩn có thể làm tăng nguy cơ đau bụng hoặc bệnh đường tiêu hóa.']],goodTitle:'Lựa chọn an toàn hơn',goodFx:[['🗑️','Bỏ thức ăn đã rơi xuống nơi bẩn.'],['👐','Rửa tay nếu vừa nhặt đồ dưới sàn.'],['🍎','Lấy phần thức ăn sạch khác để ăn.']]},
{id:6,icon:'✂️',title:'Giữ móng tay sạch',intro:'Móng tay đã dài và có bụi bẩn nằm dưới móng.',bad:'Kệ vậy',good:'Làm sạch móng',tool:'✂️',kid:'🖐️',left:'🪴',right:'🍎',action:'Kéo dụng cụ qua đầu các ngón tay để cắt gọn và làm sạch móng.',badTitle:'Móng tay bẩn có vấn đề gì?',badFx:[['🦠','Bụi và vi sinh vật dễ mắc dưới móng dài.'],['🍎','Khi cầm thức ăn, chất bẩn dưới móng có thể chuyển sang thức ăn.'],['😖','Móng quá dài cũng dễ xước, gãy hoặc cào vào da.']],goodTitle:'Móng tay sạch, gọn',goodFx:[['✂️','Cắt móng gọn vừa phải, không cắt quá sát.'],['🧼','Rửa kỹ đầu ngón và dưới móng khi rửa tay.'],['✨','Giữ móng sạch giúp giảm nơi bụi bẩn tích tụ.']]}
];
const $=s=>document.querySelector(s),stage=$('#stage'),world=$('#world'),title=$('#sceneTitle'),kid=$('#kid'),germs=$('#germs'),left=$('#leftProp'),right=$('#rightProp'),tool=$('#tool'),msg=$('#msg'),detail=$('#detail'),fill=$('#fill'),buttons=$('#buttons'),overlay=$('#overlay'),card=$('#card');let ep=episodes[0],progress=0,drag=false,pid=null,last=0;
const button=(t,c,f)=>{const b=document.createElement('button');b.type='button';b.className='btn '+(c||'');b.textContent=t;b.addEventListener('click',f);return b};const actions=(...a)=>buttons.replaceChildren(...a);const say=(a,b='')=>{msg.textContent=a;detail.textContent=b};
function info(h,fx,next){card.innerHTML=`<h2>${h}</h2><div class="effects">${fx.map(x=>`<div class="effect"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div><div class="buttons" style="margin-top:14px"><button class="btn primary" id="ok">Hiểu rồi ✓</button></div>`;overlay.classList.add('show');$('#ok').onclick=()=>{overlay.classList.remove('show');next&&next()}}
function chooseEpisode(id){ep=episodes.find(x=>x.id===id)||episodes[0];progress=0;fill.style.width='0';world.classList.remove('clean');tool.classList.remove('show');title.textContent=`Tập ${ep.id} · ${ep.title}`;kid.textContent=ep.kid;left.textContent=ep.left;right.textContent=ep.right;tool.textContent=ep.tool;say(ep.intro,'Hãy chọn điều bạn nhỏ nên làm.');actions(button('⚠️ '+ep.bad,'bad',badChoice),button('✅ '+ep.good,'primary',goodChoice));overlay.classList.remove('show')}
function menu(){card.innerHTML=`<h2>🫧 Chọn tập</h2><div class="episodes">${episodes.map(e=>`<button class="ep ${e.id===ep.id?'active':''}" data-id="${e.id}"><span>${e.icon}</span>Tập ${e.id}: ${e.title}</button>`).join('')}</div>`;overlay.classList.add('show');card.querySelectorAll('.ep').forEach(b=>b.onclick=()=>chooseEpisode(+b.dataset.id))}
function badChoice(){kid.classList.add('shake');setTimeout(()=>kid.classList.remove('shake'),800);animateGerms();info(ep.badTitle,ep.badFx,()=>{say('Mình chọn cách sạch sẽ hơn nhé!',ep.action);actions(button('✅ '+ep.good,'primary',goodChoice))})}
function animateGerms(){const sr=stage.getBoundingClientRect(),kr=kid.getBoundingClientRect(),rr=right.getBoundingClientRect();for(let i=0;i<4;i++){const g=document.createElement('span');g.className='fly';g.textContent='🦠';g.style.left=(kr.left-sr.left+40+i*15)+'px';g.style.top=(kr.top-sr.top+60+i*15)+'px';stage.append(g);requestAnimationFrame(()=>{g.style.left=(rr.left-sr.left+20+i*5)+'px';g.style.top=(rr.top-sr.top+20+i*4)+'px';g.style.transform='scale(.6) rotate(30deg)'});setTimeout(()=>g.remove(),1100)}}
function goodChoice(){progress=8;fill.style.width='8%';tool.classList.add('show');say(ep.action,'Kéo biểu tượng bên dưới qua nhân vật cho đến khi thanh sạch đầy.');actions(button('↻ Làm lại','',()=>chooseEpisode(ep.id)))}
function scrub(cx,cy){const sr=stage.getBoundingClientRect(),wr=world.getBoundingClientRect(),kr=kid.getBoundingClientRect();const x=cx-sr.left,y=cy-sr.top;tool.style.left=(x-38)+'px';tool.style.top=(y-28)+'px';tool.style.bottom='auto';if(cx>kr.left-45&&cx<kr.right+45&&cy>kr.top-45&&cy<kr.bottom+45){const now=performance.now();if(now-last>45){progress=Math.min(100,progress+3);fill.style.width=progress+'%';last=now;const b=document.createElement('i');b.className='fly';b.textContent=ep.id===3?'✨':'🫧';b.style.left=x+'px';b.style.top=y+'px';b.style.fontSize='20px';stage.append(b);requestAnimationFrame(()=>{b.style.top=(y-65)+'px';b.style.opacity='0'});setTimeout(()=>b.remove(),700);if(progress>=100)complete()}}}
tool.onpointerdown=e=>{drag=true;pid=e.pointerId;tool.setPointerCapture&&tool.setPointerCapture(pid);tool.classList.add('dragging');scrub(e.clientX,e.clientY);e.preventDefault()};tool.onpointermove=e=>{if(drag&&e.pointerId===pid){scrub(e.clientX,e.clientY);e.preventDefault()}};const release=e=>{drag=false;pid=null;tool.classList.remove('dragging')};tool.onpointerup=release;tool.onpointercancel=release;
function complete(){if(!tool.classList.contains('show'))return;tool.classList.remove('show');world.classList.add('clean');fill.style.width='100%';info(ep.goodTitle,ep.goodFx,()=>{say(`Hoàn thành Tập ${ep.id}! 🌟`,'Bạn đã chọn một thói quen vệ sinh tốt.');actions(button('⭐ Tập tiếp theo','good',()=>chooseEpisode(ep.id===episodes.length?1:ep.id+1)),button('☰ Chọn tập','',menu));buttons.prepend(Object.assign(document.createElement('div'),{className:'stars',textContent:'⭐ ⭐ ⭐'}))})}
$('#menuBtn').onclick=menu;overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('show')});chooseEpisode(1);
})();
</script></body></html>
