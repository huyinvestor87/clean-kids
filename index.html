<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff7ff" />
  <title>Clean Kids - Tập 1: Tắm sạch trước bữa tối</title>
  <style>
    :root {
      --ink: #17324d;
      --sky: #dff7ff;
      --blue: #4da8ff;
      --green: #58c77a;
      --yellow: #ffd85a;
      --card: rgba(255,255,255,.92);
      --shadow: 0 12px 30px rgba(36, 82, 120, .16);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); background: linear-gradient(#dff7ff, #fff7dc); }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 12px; overflow-x: hidden; }
    button { font: inherit; }
    .app { width: min(100%, 900px); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .brand { font-weight: 900; font-size: clamp(20px, 4vw, 30px); }
    .episode { background:#fff; border-radius:999px; padding:8px 14px; font-weight:800; box-shadow:var(--shadow); }
    .scene { position:relative; min-height:min(720px, calc(100dvh - 120px)); overflow:hidden; border-radius:28px; background:linear-gradient(#bcecff 0 44%, #f7efd6 44% 100%); box-shadow:var(--shadow); border:4px solid rgba(255,255,255,.85); }
    .sun { position:absolute; width:78px; height:78px; border-radius:50%; background:#ffe16b; top:34px; right:42px; box-shadow:0 0 0 14px rgba(255,225,107,.25); }
    .cloud { position:absolute; width:110px; height:35px; border-radius:30px; background:#fff; top:72px; left:45px; opacity:.9; }
    .cloud:before,.cloud:after { content:""; position:absolute; background:#fff; border-radius:50%; }
    .cloud:before { width:48px;height:48px;left:15px;top:-22px; }
    .cloud:after { width:60px;height:60px;right:12px;top:-30px; }
    .room-line { position:absolute; inset:44% 0 auto; height:6px; background:#d2c39d; }
    .bathroom { position:absolute; left:5%; bottom:22%; width:43%; height:42%; border-radius:26px; background:linear-gradient(135deg,#eefcff,#cfefff); border:4px solid #fff; box-shadow:inset 0 0 0 3px #b5ddec; }
    .bathroom:before { content:"PHÒNG TẮM"; position:absolute; top:12px; left:16px; font-size:13px; font-weight:900; letter-spacing:.08em; opacity:.6; }
    .shower { position:absolute; top:50px; left:50%; width:74px; height:34px; border:8px solid #7aa7c7; border-bottom:0; border-left:0; border-radius:0 30px 0 0; transform:translateX(-8px); }
    .shower:after { content:""; position:absolute; right:-8px; bottom:-14px; width:52px; height:18px; border-radius:14px 14px 6px 6px; background:#6d97b5; }
    .water { position:absolute; top:103px; left:58%; width:65px; height:170px; opacity:0; transition:.25s; pointer-events:none; background:repeating-linear-gradient(90deg, transparent 0 8px, rgba(64,170,255,.45) 8px 12px); filter:drop-shadow(0 2px 2px rgba(255,255,255,.8)); }
    .water.on { opacity:1; animation:water 1s linear infinite; }
    @keyframes water { to { background-position-y:30px; } }
    .dinner { position:absolute; right:4%; bottom:25%; width:40%; height:28%; border-radius:24px; background:#fff4cf; border:4px solid #fff; box-shadow:inset 0 0 0 3px #f1dca7; }
    .table { position:absolute; left:12%; right:12%; bottom:24%; height:22px; border-radius:14px; background:#bb7a45; }
    .table:before,.table:after { content:""; position:absolute; width:13px; height:92px; background:#9a6138; top:14px; }
    .table:before { left:18%; } .table:after { right:18%; }
    .plate { position:absolute; width:110px; height:46px; border-radius:50%; background:#fff; left:50%; bottom:35%; transform:translateX(-50%); box-shadow:inset 0 0 0 7px #d8ecf7; }
    .rice { position:absolute; width:70px; height:38px; border-radius:50% 50% 42% 42%; background:#fffdf4; left:50%; bottom:42%; transform:translateX(-50%); box-shadow:inset 0 -8px 0 #f0ead9; }
    .kid { position:absolute; left:18%; bottom:24%; width:150px; height:250px; transition:left .7s ease, bottom .7s ease, transform .3s; z-index:4; }
    .kid.at-bath { left:22%; bottom:24%; }
    .kid.at-table { left:67%; bottom:20%; transform:scale(.94); }
    .head { position:absolute; top:15px; left:39px; width:76px; height:82px; border-radius:46% 46% 44% 44%; background:#f3bc8e; border:4px solid rgba(113,70,44,.15); }
    .hair { position:absolute; width:80px; height:38px; border-radius:42px 42px 18px 18px; background:#4d3528; top:8px; left:37px; transform:rotate(-4deg); }
    .eye { position:absolute; top:47px; width:8px; height:11px; border-radius:50%; background:#26384d; z-index:2; }
    .eye.l { left:59px; } .eye.r { left:91px; }
    .smile { position:absolute; top:72px; left:70px; width:22px; height:10px; border-bottom:4px solid #a75b55; border-radius:50%; z-index:2; }
    .body { position:absolute; top:94px; left:31px; width:92px; height:100px; border-radius:28px 28px 18px 18px; background:#ff9f6e; }
    .arm { position:absolute; top:105px; width:25px; height:90px; border-radius:20px; background:#f3bc8e; transform-origin:top center; }
    .arm.l { left:20px; transform:rotate(12deg); } .arm.r { right:14px; transform:rotate(-15deg); }
    .leg { position:absolute; top:182px; width:29px; height:72px; border-radius:18px; background:#4b75b8; }
    .leg.l { left:43px; } .leg.r { left:82px; }
    .dirt { position:absolute; width:16px; height:12px; border-radius:50%; background:#8a684f; opacity:.78; z-index:5; transition:.25s; }
    .d1{top:80px;left:43px}.d2{top:124px;left:27px}.d3{top:143px;right:18px}.d4{top:177px;left:68px}.d5{top:212px;right:40px}
    .germ { position:absolute; z-index:6; width:34px; height:34px; border-radius:48% 52% 46% 54%; background:#7ad35c; border:3px solid #2c9d55; display:grid; place-items:center; font-size:18px; animation:bob 1.2s ease-in-out infinite alternate; transition:.3s; }
    .g1{top:66px;right:13px}.g2{top:129px;left:14px;animation-delay:.25s}.g3{top:186px;right:22px;animation-delay:.55s}
    @keyframes bob { to { transform:translateY(-8px) rotate(8deg); } }
    .cleaning .dirt { opacity:0; transform:scale(.4); }
    .cleaning .germ { opacity:0; transform:scale(.2) translateY(-40px); }
    .soap { position:absolute; left:16%; bottom:13%; width:76px; height:50px; border-radius:16px; background:#ff8fc4; border:4px solid #fff; display:grid; place-items:center; font-weight:900; box-shadow:0 8px 20px rgba(0,0,0,.12); cursor:grab; user-select:none; touch-action:none; z-index:10; }
    .soap.active { transform:scale(1.08) rotate(-5deg); }
    .bubble { position:absolute; border-radius:50%; border:2px solid rgba(64,157,205,.35); background:rgba(255,255,255,.7); pointer-events:none; z-index:8; animation:float .9s ease-out forwards; }
    @keyframes float { to { transform:translateY(-70px) scale(1.35); opacity:0; } }
    .panel { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; width:min(92%,720px); padding:14px; border-radius:22px; background:var(--card); box-shadow:var(--shadow); z-index:20; backdrop-filter:blur(10px); }
    .message { font-size:clamp(17px,3vw,22px); font-weight:900; text-align:center; margin-bottom:10px; min-height:30px; }
    .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .btn { border:0; border-radius:16px; padding:12px 18px; min-height:48px; font-weight:900; color:#17324d; background:#fff; box-shadow:0 5px 0 rgba(32,74,110,.16); cursor:pointer; }
    .btn.primary { background:var(--yellow); }
    .btn.good { background:#8ce5a4; }
    .btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(32,74,110,.16); }
    .progress { height:18px; border-radius:999px; background:#d8e8ee; overflow:hidden; margin:8px 0 12px; border:3px solid #fff; }
    .progress > div { height:100%; width:0%; background:linear-gradient(90deg,#5ec7ff,#67df94); transition:width .25s; }
    .hint { text-align:center; font-size:14px; font-weight:700; opacity:.72; }
    .toast { position:absolute; left:50%; top:16%; transform:translate(-50%,-20px); background:#fff; border-radius:20px; padding:14px 18px; font-weight:900; opacity:0; pointer-events:none; transition:.25s; z-index:30; box-shadow:var(--shadow); text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .stars { font-size:44px; letter-spacing:7px; text-align:center; animation:pop .5s ease-out; }
    @keyframes pop { from { transform:scale(.4); opacity:0 } }
    @media (max-width: 640px) {
      body { padding:0; }
      .app { width:100%; }
      .topbar { padding:10px 12px 0; }
      .scene { min-height:calc(100dvh - 66px); border-radius:22px 22px 0 0; border-left:0; border-right:0; border-bottom:0; }
      .bathroom { left:2%; width:49%; }
      .dinner { right:2%; width:45%; }
      .kid { transform:scale(.82); transform-origin:bottom center; left:16%; }
      .kid.at-bath { left:16%; }
      .kid.at-table { left:62%; transform:scale(.76); }
      .soap { left:8%; bottom:15%; }
      .panel { bottom:10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">🫧 Clean Kids</div>
      <div class="episode">Tập 1 · Trước bữa tối</div>
    </header>

    <section class="scene" id="scene" aria-label="Hoạt cảnh tắm sạch trước khi ăn tối">
      <div class="sun"></div><div class="cloud"></div><div class="room-line"></div>
      <div class="bathroom">
        <div class="shower"></div><div class="water" id="water"></div>
      </div>
      <div class="dinner">
        <div class="table"></div><div class="plate"></div><div class="rice"></div>
      </div>

      <div class="kid" id="kid" aria-label="Bạn nhỏ đang bị bẩn">
        <div class="hair"></div><div class="head"></div>
        <div class="eye l"></div><div class="eye r"></div><div class="smile"></div>
        <div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div>
        <i class="dirt d1"></i><i class="dirt d2"></i><i class="dirt d3"></i><i class="dirt d4"></i><i class="dirt d5"></i>
        <i class="germ g1">😈</i><i class="germ g2">😈</i><i class="germ g3">😈</i>
      </div>

      <div class="soap" id="soap" role="button" aria-label="Xà phòng">🧼</div>
      <div class="toast" id="toast"></div>

      <div class="panel">
        <div class="message" id="message">Đến giờ ăn tối rồi! Nhưng bạn nhỏ vừa chơi ngoài sân về.</div>
        <div class="progress" aria-label="Độ sạch"><div id="progressFill"></div></div>
        <div class="actions" id="actions">
          <button class="btn primary" id="startBtn">👀 Xem vi khuẩn</button>
        </div>
        <div class="hint" id="hint">Chạm để bắt đầu câu chuyện</div>
      </div>
    </section>
  </main>

<script>
(() => {
  const scene = document.getElementById('scene');
  const kid = document.getElementById('kid');
  const soap = document.getElementById('soap');
  const water = document.getElementById('water');
  const message = document.getElementById('message');
  const actions = document.getElementById('actions');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');
  const fill = document.getElementById('progressFill');

  let stage = 0;
  let clean = 0;
  let scrubbing = false;
  let pointerId = null;
  let lastBubble = 0;

  function setMessage(text, hintText='') {
    message.textContent = text;
    hint.textContent = hintText;
  }

  function button(label, className, onClick) {
    const b = document.createElement('button');
    b.className = 'btn ' + (className || '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function setActions(...buttons) {
    actions.replaceChildren(...buttons);
  }

  function showToast(text, ms=1600) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function setClean(value) {
    clean = Math.max(0, Math.min(100, value));
    fill.style.width = clean + '%';
    if (clean >= 100) finishBath();
  }

  function startStory() {
    stage = 1;
    setMessage('Ôi! Bụi bẩn và vi khuẩn đang bám trên người!', 'Con có nhìn thấy những bạn vi khuẩn tinh nghịch không?');
    setActions(
      button('🍚 Ăn luôn', '', tryEatDirty),
      button('🚿 Đi tắm', 'primary', goBath)
    );
  }

  function tryEatDirty() {
    showToast('🦠 Khoan! Vi khuẩn có thể theo tay và cơ thể bẩn đến gần thức ăn.');
    kid.classList.remove('at-table');
    setMessage('Mình nên tắm rửa sạch sẽ trước khi ăn tối nhé!', 'Chọn “Đi tắm” để giúp bạn nhỏ.');
  }

  function goBath() {
    stage = 2;
    kid.classList.add('at-bath');
    water.classList.add('on');
    setClean(10);
    setMessage('Bật nước rồi! Bây giờ dùng xà phòng để làm sạch.', 'Kéo cục xà phòng 🧼 chà lên bạn nhỏ.');
    setActions(button('💦 Dội nước', '', () => {
      if (clean < 35) showToast('Nước giúp trôi bụi, nhưng cần xà phòng để làm sạch kỹ hơn!');
      else setClean(clean + 6);
    }));
  }

  function finishBath() {
    if (stage >= 3) return;
    stage = 3;
    kid.classList.add('cleaning');
    soap.style.display = 'none';
    water.classList.remove('on');
    setMessage('Sạch bóng rồi! Vi khuẩn và bụi bẩn đã được rửa trôi.', 'Giờ thì có thể mặc đồ sạch và đi ăn tối.');
    setActions(button('👕 Mặc đồ sạch', 'good', readyDinner));
    celebrateBubbles();
  }

  function readyDinner() {
    stage = 4;
    kid.classList.remove('at-bath');
    kid.classList.add('at-table');
    setMessage('Tuyệt lắm! Cơ thể sạch sẽ trước bữa ăn.', 'Một thói quen nhỏ giúp mình khỏe mạnh mỗi ngày.');
    setActions(button('🍚 Ăn tối thôi!', 'primary', success));
  }

  function success() {
    stage = 5;
    setMessage('Hoàn thành Tập 1! Tắm sạch trước bữa tối khi cơ thể bẩn nhé.', 'Clean Kids · Sạch sẽ – khỏe mạnh – vui vẻ!');
    const stars = document.createElement('div');
    stars.className = 'stars'; stars.textContent = '⭐ ⭐ ⭐';
    actions.replaceChildren(stars, button('↻ Chơi lại', '', reset));
    celebrateBubbles(24);
  }

  function reset() {
    stage = 0; clean = 0; fill.style.width='0%';
    kid.className = 'kid'; soap.style.display='grid'; water.classList.remove('on');
    setMessage('Đến giờ ăn tối rồi! Nhưng bạn nhỏ vừa chơi ngoài sân về.', 'Chạm để bắt đầu câu chuyện');
    setActions(button('👀 Xem vi khuẩn', 'primary', startStory));
  }

  function createBubble(x, y, big=false) {
    const b = document.createElement('i');
    b.className='bubble';
    const s = big ? 22 + Math.random()*22 : 10 + Math.random()*18;
    b.style.width=s+'px'; b.style.height=s+'px'; b.style.left=(x-s/2)+'px'; b.style.top=(y-s/2)+'px';
    scene.appendChild(b); setTimeout(()=>b.remove(),950);
  }

  function celebrateBubbles(n=14) {
    const r=scene.getBoundingClientRect();
    for(let i=0;i<n;i++) setTimeout(()=>createBubble(Math.random()*r.width, r.height*(.35+Math.random()*.45), true), i*45);
  }

  function scrubAt(clientX, clientY) {
    if(stage!==2) return;
    const sr=scene.getBoundingClientRect(), kr=kid.getBoundingClientRect();
    const x=clientX-sr.left, y=clientY-sr.top;
    soap.style.position='absolute'; soap.style.left=(x-38)+'px'; soap.style.top=(y-25)+'px'; soap.style.bottom='auto';
    const over = clientX >= kr.left-25 && clientX <= kr.right+25 && clientY >= kr.top-25 && clientY <= kr.bottom+25;
    const now=performance.now();
    if(over) {
      if(now-lastBubble>55) { createBubble(x,y); lastBubble=now; }
      setClean(clean + 1.7);
      if(clean > 35 && clean < 45) showToast('🫧 Giỏi lắm! Nhớ chà khắp người nhé.');
      if(clean > 70 && clean < 80) showToast('🦠 Vi khuẩn đang chạy mất rồi!');
    }
  }

  soap.addEventListener('pointerdown', e => {
    if(stage!==2) { if(stage<2) showToast('Đi tắm trước rồi mình dùng xà phòng nhé!'); return; }
    pointerId=e.pointerId; scrubbing=true; soap.setPointerCapture(pointerId); soap.classList.add('active'); scrubAt(e.clientX,e.clientY); e.preventDefault();
  });
  soap.addEventListener('pointermove', e => { if(scrubbing && e.pointerId===pointerId) { scrubAt(e.clientX,e.clientY); e.preventDefault(); } });
  function release(e){ if(!scrubbing) return; scrubbing=false; pointerId=null; soap.classList.remove('active'); }
  soap.addEventListener('pointerup', release); soap.addEventListener('pointercancel', release);

  document.getElementById('startBtn').addEventListener('click', startStory);
})();
</script>
</body>
</html>
