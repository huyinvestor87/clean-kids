<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clean Kids - Tập 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#c8f1ff,#fff3c9);color:#16324a;min-height:100dvh;display:grid;place-items:center}.app{width:min(950px,100%);padding:12px}.head{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:clamp(20px,4vw,30px);margin:4px 4px 10px}.tag{font-size:14px;background:#fff;padding:8px 12px;border-radius:99px}.scene{position:relative;min-height:min(760px,calc(100dvh - 80px));overflow:hidden;border:4px solid #fff;border-radius:28px;background:linear-gradient(#bcecff 0 42%,#f7efd8 42%);box-shadow:0 15px 40px #3a76952b}.bath,.dining{position:absolute;bottom:26%;height:43%;border:4px solid white;border-radius:24px}.bath{left:3%;width:46%;background:#dff7ff}.dining{right:3%;width:44%;background:#fff1c5}.bath:before,.dining:before{position:absolute;top:12px;left:14px;font-size:13px;font-weight:900;opacity:.55}.bath:before{content:'PHÒNG TẮM'}.dining:before{content:'BỮA TỐI'}.shower{position:absolute;top:58px;right:23%;width:68px;height:40px;border:8px solid #719bb8;border-left:0;border-bottom:0;border-radius:0 28px 0 0}.water{position:absolute;right:16%;top:106px;width:70px;height:190px;opacity:0;background:repeating-linear-gradient(90deg,transparent 0 8px,#54baff77 8px 12px);transition:.2s}.water.on{opacity:1;animation:flow .6s linear infinite}@keyframes flow{to{background-position-y:30px}}.table{position:absolute;left:12%;right:12%;bottom:30%;height:20px;border-radius:10px;background:#ad7044}.plate{position:absolute;left:50%;bottom:38%;transform:translateX(-50%);width:120px;height:50px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 7px #d8eaf3}.rice{position:absolute;left:50%;bottom:45%;transform:translateX(-50%);width:72px;height:40px;border-radius:50%;background:#fffdf5}.kid{position:absolute;left:18%;bottom:26%;width:150px;height:250px;z-index:5;transition:.65s}.kid.tablepos{left:67%;bottom:23%}.face{position:absolute;top:18px;left:40px;width:76px;height:80px;border-radius:45%;background:#f3bb8b}.hair{position:absolute;top:8px;left:38px;width:80px;height:38px;border-radius:40px 40px 15px 15px;background:#493328}.eyes:before,.eyes:after{content:'';position:absolute;top:49px;width:8px;height:10px;border-radius:50%;background:#25364a;z-index:2}.eyes:before{left:60px}.eyes:after{left:91px}.mouth{position:absolute;top:73px;left:70px;width:22px;height:10px;border-bottom:4px solid #a55b55;border-radius:50%;z-index:2}.body{position:absolute;top:94px;left:30px;width:94px;height:102px;border-radius:28px;background:#ff9c68}.arm{position:absolute;top:108px;width:25px;height:88px;background:#f3bb8b;border-radius:18px}.a1{left:19px;transform:rotate(12deg)}.a2{right:12px;transform:rotate(-14deg)}.leg{position:absolute;top:184px;width:30px;height:69px;background:#5077b7;border-radius:17px}.l1{left:42px}.l2{left:82px}.dirt,.germ{position:absolute;z-index:8;transition:.4s}.dirt{width:17px;height:12px;border-radius:50%;background:#775942}.d1{top:75px;left:43px}.d2{top:130px;left:20px}.d3{top:158px;right:18px}.d4{top:205px;right:38px}.germ{font-size:29px;animation:bob .8s alternate infinite}.g1{top:63px;right:10px}.g2{top:136px;left:4px}.g3{top:185px;right:13px}@keyframes bob{to{transform:translateY(-8px) rotate(8deg)}}.clean .dirt,.clean .germ{opacity:0;transform:scale(.2)}.soap{position:absolute;left:12%;bottom:15%;z-index:15;font-size:38px;background:#ff9bc7;border:4px solid #fff;border-radius:18px;padding:8px 16px;touch-action:none;user-select:none;cursor:grab}.panel{position:absolute;z-index:30;bottom:14px;left:50%;transform:translateX(-50%);width:min(92%,760px);background:#fffffff2;border-radius:22px;padding:14px;box-shadow:0 12px 32px #345f7a2b}.msg{text-align:center;font-weight:900;font-size:clamp(17px,3vw,22px);min-height:30px}.detail{text-align:center;margin:7px 0 10px;font-weight:700;opacity:.8;min-height:22px}.bar{height:17px;background:#d9e8ec;border-radius:99px;overflow:hidden;margin:8px 0 12px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#4ebcff,#62d987);transition:.2s}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:12px 16px;font:inherit;font-weight:900;background:#fff;box-shadow:0 4px 0 #1d4e7122}.primary{background:#ffdb62}.good{background:#86e3a1}.bad{background:#ffc1b7}.card{position:absolute;z-index:25;left:50%;top:14%;transform:translate(-50%,-12px);width:min(86%,620px);background:white;border-radius:24px;padding:18px;box-shadow:0 14px 40px #254d6835;opacity:0;pointer-events:none;transition:.25s}.card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.card h2{margin:0 0 8px;text-align:center}.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.effect{background:#f5f8fa;border-radius:16px;padding:10px;text-align:center;font-weight:800}.effect b{display:block;font-size:28px;margin-bottom:4px}.stars{text-align:center;font-size:42px}.germFly{position:absolute;z-index:24;font-size:30px;pointer-events:none;transition:1.15s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 3px 2px #0002)}.foodGerm{position:absolute;z-index:12;font-size:25px;animation:bob .55s alternate infinite}.belly{position:absolute;z-index:26;left:50%;top:14%;transform:translateX(-50%) scale(.7);width:min(84%,430px);padding:18px;border-radius:26px;background:#fff7e8;border:4px solid #fff;box-shadow:0 14px 40px #254d6835;text-align:center;opacity:0;transition:.3s}.belly.show{opacity:1;transform:translateX(-50%) scale(1)}.bellyIcon{font-size:70px}.bellyGerms{font-size:34px;letter-spacing:8px;animation:bob .5s alternate infinite}.washGerm{position:absolute;z-index:19;font-size:27px;pointer-events:none;transition:.85s ease-in;opacity:1}.washGerm.away{transform:translateY(150px) rotate(150deg) scale(.4);opacity:0}.bubble{position:absolute;border:2px solid #65b7dd88;background:#ffffffaa;border-radius:50%;z-index:20;pointer-events:none;animation:rise .9s forwards}@keyframes rise{to{transform:translateY(-80px) scale(1.4);opacity:0}}@media(max-width:620px){.app{padding:0}.head{padding:8px 10px 0}.scene{border-left:0;border-right:0;border-bottom:0;border-radius:22px 22px 0 0;min-height:calc(100dvh - 66px)}.kid{transform:scale(.78);transform-origin:bottom center;left:13%}.kid.tablepos{left:61%;transform:scale(.72)}.bath{left:1%;width:49%}.dining{right:1%;width:47%}.effects{grid-template-columns:1fr}.card{top:9%}.soap{left:6%;bottom:17%}}
</style>
</head>
<body>
<main class="app">
<div class="head"><span>🫧 Clean Kids</span><span class="tag">Tập 1 · Tắm trước bữa tối</span></div>
<section class="scene" id="scene">
  <div class="bath"><div class="shower"></div><div class="water" id="water"></div></div>
  <div class="dining"><div class="table"></div><div class="plate"></div><div class="rice"></div></div>
  <div class="kid" id="kid"><div class="hair"></div><div class="face"></div><div class="eyes"></div><div class="mouth"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><i class="dirt d1"></i><i class="dirt d2"></i><i class="dirt d3"></i><i class="dirt d4"></i><i class="germ g1">🦠</i><i class="germ g2">🦠</i><i class="germ g3">🦠</i></div>
  <div class="soap" id="soap">🧼</div>
  <div class="card" id="card"></div><div class="belly" id="belly"></div>
  <div class="panel"><div class="msg" id="msg">Bạn nhỏ vừa chạy nhảy ngoài sân về và sắp ăn tối.</div><div class="detail" id="detail">Trên da đang có mồ hôi, bụi bẩn và vi sinh vật từ môi trường.</div><div class="bar"><div id="fill"></div></div><div class="buttons" id="buttons"><button class="btn primary" id="start">Bắt đầu 👀</button></div></div>
</section>
</main>
<script>
(()=>{
const scene=document.querySelector('#scene'),kid=document.querySelector('#kid'),soap=document.querySelector('#soap'),water=document.querySelector('#water'),msg=document.querySelector('#msg'),detail=document.querySelector('#detail'),buttons=document.querySelector('#buttons'),fill=document.querySelector('#fill'),card=document.querySelector('#card'),belly=document.querySelector('#belly');
let stage=0,clean=0,drag=false,pid=null,last=0;
const btn=(t,c,f)=>{const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=t;b.onclick=f;return b};
const actions=(...x)=>buttons.replaceChildren(...x);
function text(a,b=''){msg.textContent=a;detail.textContent=b}
function info(title,items,next){card.innerHTML=`<h2>${title}</h2><div class="effects">${items.map(x=>`<div class="effect"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div><div class="buttons" style="margin-top:12px"></div>`;card.classList.add('show');const area=card.querySelector('.buttons');area.append(btn('Hiểu rồi ✓','primary',()=>{card.classList.remove('show');next&&next()}))}
function setClean(v){clean=Math.min(100,v);fill.style.width=clean+'%';if(clean>=100)doneBath()}
function start(){stage=1;text('Nhìn kỹ nhé: cơ thể chưa sạch trước bữa tối.','Nếu vừa chơi ngoài trời, mồ hôi và bụi bẩn có thể còn bám trên da.');actions(btn('🍚 Không tắm, ăn luôn','bad',dirtyChoice),btn('🚿 Tắm trước','primary',bath))}
function flyGermsToFood(next){const sr=scene.getBoundingClientRect(),kr=kid.getBoundingClientRect(),pr=document.querySelector('.plate').getBoundingClientRect();let n=0;[0,1,2].forEach((_,i)=>{const g=document.createElement('span');g.className='germFly';g.textContent='🦠';g.style.left=(kr.left-sr.left+60+i*18)+'px';g.style.top=(kr.top-sr.top+90+i*35)+'px';scene.append(g);requestAnimationFrame(()=>{g.style.left=(pr.left-sr.left+35+i*14)+'px';g.style.top=(pr.top-sr.top+5+i*4)+'px';g.style.transform='scale(.8) rotate(25deg)'});setTimeout(()=>{g.className='foodGerm';g.style.transition='';if(++n===3)setTimeout(next,650)},1200)})}
function foodToMouth(next){const sr=scene.getBoundingClientRect(),kr=kid.getBoundingClientRect();document.querySelectorAll('.foodGerm').forEach((g,i)=>{g.className='germFly';g.style.left=(kr.left-sr.left+70)+'px';g.style.top=(kr.top-sr.top+72)+'px';g.style.transform='scale(.35)';setTimeout(()=>g.remove(),900)});setTimeout(()=>{belly.innerHTML='<div class="bellyIcon">🤢</div><h2>Vi khuẩn có thể vào cơ thể</h2><div class="bellyGerms">🦠 🦠 🦠</div><p>Tay bẩn chạm thức ăn rồi đưa thức ăn vào miệng có thể mang theo mầm bệnh.</p>';belly.classList.add('show');setTimeout(()=>{belly.classList.remove('show');next()},2200)},950)}
function dirtyChoice(){kid.classList.add('tablepos');text('Ôi! Tay bẩn đang chạm vào bữa tối...','Hãy xem vi khuẩn có thể đi đâu.');actions();flyGermsToFood(()=>{text('Vi khuẩn đã theo tay đến gần thức ăn!','Nếu ăn ngay, chúng có thể theo thức ăn vào miệng.');setTimeout(()=>foodToMouth(()=>info('Nếu cứ để cơ thể bẩn thì sao?',[
['🦠','Vi sinh vật và bụi bẩn vẫn còn bám trên da, đặc biệt ở bàn tay.'],
['😣','Mồ hôi + bụi có thể gây mùi khó chịu, bí da hoặc ngứa ở một số trẻ.'],
['🍚','Tay bẩn chạm thức ăn hoặc đưa lên miệng có thể làm tăng nguy cơ đưa mầm bệnh vào cơ thể.']
],()=>{kid.classList.remove('tablepos');text('Vậy mình làm sạch cơ thể trước khi ngồi ăn nhé!','Tắm không làm cơ thể “vô trùng”, nhưng giúp rửa trôi mồ hôi, bụi bẩn và giảm vi sinh vật bám ngoài da.');actions(btn('🚿 Đi tắm ngay','primary',bath))})))})}
function bath(){stage=2;kid.classList.remove('tablepos');water.classList.add('on');setClean(8);text('Bắt đầu tắm!','Kéo xà phòng 🧼 chà lên bạn nhỏ để làm sạch.');actions(btn('💦 Xả nước','',()=>{if(clean<35)info('Chỉ nước thôi chưa đủ', [['💧','Nước giúp rửa trôi một phần mồ hôi và bụi.'],['🧼','Xà phòng giúp cuốn dầu, chất bẩn và nhiều vi sinh vật khỏi bề mặt da.'],['👐','Chà nhẹ các vùng bẩn rồi xả sạch.']],null);else setClean(clean+5)}))}
function bubble(x,y){const e=document.createElement('i');e.className='bubble';let s=10+Math.random()*19;e.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;scene.append(e);setTimeout(()=>e.remove(),950)}
function scrub(cx,cy){if(stage!==2)return;const sr=scene.getBoundingClientRect(),kr=kid.getBoundingClientRect(),x=cx-sr.left,y=cy-sr.top;soap.style.left=x-40+'px';soap.style.top=y-28+'px';soap.style.bottom='auto';if(cx>kr.left-25&&cx<kr.right+25&&cy>kr.top-25&&cy<kr.bottom+25){if(performance.now()-last>50){bubble(x,y);last=performance.now()}setClean(clean+1.6)}}
soap.onpointerdown=e=>{if(stage!==2)return;drag=true;pid=e.pointerId;soap.setPointerCapture(pid);scrub(e.clientX,e.clientY)};soap.onpointermove=e=>{if(drag&&e.pointerId===pid)scrub(e.clientX,e.clientY)};soap.onpointerup=soap.onpointercancel=()=>{drag=false;pid=null};
function washAway(){const sr=scene.getBoundingClientRect(),kr=kid.getBoundingClientRect();for(let i=0;i<7;i++){const g=document.createElement('span');g.className='washGerm';g.textContent='🦠';g.style.left=(kr.left-sr.left+25+Math.random()*100)+'px';g.style.top=(kr.top-sr.top+55+Math.random()*150)+'px';scene.append(g);setTimeout(()=>g.classList.add('away'),80+i*80);setTimeout(()=>g.remove(),1100+i*80)}}
function doneBath(){if(stage>=3)return;stage=3;washAway();kid.classList.add('clean');setTimeout(()=>water.classList.remove('on'),900);soap.style.display='none';info('Sau khi tắm sạch thì sao?',[
['✨','Mồ hôi và bụi bẩn được rửa trôi, cơ thể sạch và dễ chịu hơn.'],
['🦠⬇️','Lượng vi sinh vật bám ngoài da giảm đi đáng kể nhờ rửa và xà phòng.'],
['🍽️','Mặc đồ sạch, rửa tay đúng cách rồi ngồi ăn giúp bữa tối vệ sinh hơn.']
],()=>{text('Sạch sẽ và thơm tho rồi!','Bước cuối: mặc quần áo sạch và nhớ rửa tay trước khi ăn.');actions(btn('👕 Mặc đồ sạch','good',ready))})}
function ready(){kid.classList.add('tablepos');text('Giờ thì sẵn sàng cho bữa tối!','Tắm khi cơ thể bẩn + rửa tay trước ăn = thói quen vệ sinh tốt.');actions(btn('🍚 Ăn tối thôi!','primary',finish))}
function finish(){text('Hoàn thành Tập 1! 🌟','Bài học: sau khi chơi bẩn, hãy làm sạch cơ thể; và luôn rửa tay trước khi ăn.');buttons.innerHTML='<div class="stars">⭐ ⭐ ⭐</div>';buttons.append(btn('↻ Chơi lại','',()=>location.reload()));for(let i=0;i<24;i++)setTimeout(()=>bubble(Math.random()*scene.clientWidth,scene.clientHeight*(.3+Math.random()*.5)),i*40)}
document.querySelector('#start').onclick=start;
})();
</script>
</body></html>
