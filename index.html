<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Clean Kids · v1.3.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#bdefff,#fff3c1);color:#17324a;min-height:100dvh}.app{width:min(980px,100%);margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:1000;font-size:clamp(24px,4vw,38px);color:#1598e5;text-shadow:0 3px #fff}.logo b{color:#ff9b00}.ver{font-size:11px;color:#667}.menuBtn{border:0;border-radius:16px;background:#7d59dc;color:#fff;padding:10px 15px;font-weight:900;font-size:18px}.stage{position:relative;margin-top:8px;min-height:calc(100dvh - 80px);background:linear-gradient(#d9f7ff 0 46%,#f9efd6 46%);border:4px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 14px 38px #2c66852d}.title{position:absolute;z-index:20;left:50%;top:10px;transform:translateX(-50%);background:#8055d8;color:#fff;padding:8px 16px;border-radius:18px;font-weight:1000;white-space:nowrap}.world{position:absolute;inset:0 0 155px;overflow:hidden}.kid{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:145px;filter:drop-shadow(0 8px 6px #0002);transition:.5s}.prop{position:absolute;font-size:70px;filter:drop-shadow(0 6px 4px #0002)}.leftProp{left:8%;top:52%}.rightProp{right:8%;top:52%}.germ{position:absolute;font-size:34px;animation:bob .7s alternate infinite;z-index:9}.g1{left:36%;top:28%}.g2{right:34%;top:37%;animation-delay:.2s}.g3{left:41%;bottom:20%;animation-delay:.4s}.g4{right:39%;bottom:15%;animation-delay:.1s}@keyframes bob{to{transform:translateY(-8px) rotate(8deg)}}.dirt{position:absolute;font-size:28px;z-index:8}.d1{left:40%;top:39%}.d2{right:40%;top:49%}.d3{left:44%;bottom:24%}.bubble{position:absolute;font-size:22px;pointer-events:none;z-index:30;transition:.75s}.fly{position:absolute;font-size:32px;z-index:40;pointer-events:none;transition:1.05s cubic-bezier(.2,.8,.2,1)}.inside{position:absolute;z-index:45;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);width:min(78%,420px);background:#fff7e8;border:4px solid #fff;border-radius:28px;padding:16px;text-align:center;box-shadow:0 16px 40px #0003;opacity:0;pointer-events:none;transition:.3s}.inside.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.inside .bodyIcon{font-size:72px}.inside .insideGerms{font-size:36px;letter-spacing:8px;animation:bob .5s alternate infinite}.tool{position:absolute;z-index:60;left:8%;bottom:8%;font-size:52px;background:#fff;border:4px solid #fff;border-radius:20px;padding:7px 13px;box-shadow:0 8px 18px #0002;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:none}.tool.show{display:block}.tool.dragging{transform:scale(1.08)}.water{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:60px;opacity:0;transition:.25s}.water.on{opacity:1}.clean .germ,.clean .dirt{opacity:0;transform:scale(.2);transition:.5s}.panel{position:absolute;z-index:70;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,760px);background:#fffffff2;border-radius:24px;padding:12px;box-shadow:0 12px 32px #345f7a2b}.progress{height:16px;border-radius:99px;background:#d8e7eb;overflow:hidden;margin-bottom:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ebcff,#65da85);transition:.15s}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:17px;min-width:92px;min-height:54px;padding:10px 16px;font:inherit;font-size:28px;font-weight:900;background:#fff;box-shadow:0 4px 0 #1d4e7122;touch-action:manipulation}.bad{background:#ffc0b5}.good{background:#8ce3a3}.primary{background:#ffdc63}.hint{text-align:center;font-size:15px;font-weight:800;opacity:.7;margin-top:6px}.stars{text-align:center;font-size:44px}.overlay{position:fixed;inset:0;background:#17324a66;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.overlay.show{display:flex}.card{width:min(650px,96%);background:#fff;border-radius:26px;padding:18px}.episodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ep{border:0;border-radius:18px;padding:14px;background:#eef8fb;font:inherit;font-weight:900}.ep span{display:block;font-size:46px}.ep.active{outline:4px solid #71d894;background:#effff4}.close{display:block;margin:14px auto 0;border:0;border-radius:16px;padding:12px 18px;background:#7d59dc;color:#fff;font-weight:900;font-size:18px}@media(max-width:620px){.app{padding:0}.top{padding:8px}.stage{border-left:0;border-right:0;border-bottom:0;border-radius:22px 22px 0 0}.world{inset:0 0 175px}.kid{font-size:118px}.prop{font-size:55px}.leftProp{left:3%}.rightProp{right:3%}.title{font-size:14px;top:8px}.tool{left:4%;bottom:13%}.episodes{grid-template-columns:1fr 1fr}.inside{top:39%;width:88%}}
</style></head>
<body><main class="app"><div class="top"><div class="logo">CLEAN <b>KIDS</b> <small class="ver">v1.3.0</small></div><button class="menuBtn" id="menuBtn">☰</button></div><section class="stage" id="stage"><div class="title" id="title"></div><div class="world" id="world"><div class="prop leftProp" id="leftProp"></div><div class="kid" id="kid">🧒</div><div id="germs"><i class="germ g1">🦠</i><i class="germ g2">🦠</i><i class="germ g3">🦠</i><i class="germ g4">🦠</i></div><i class="dirt d1">🟤</i><i class="dirt d2">🟤</i><i class="dirt d3">🟤</i><div class="prop rightProp" id="rightProp"></div><div class="water" id="water">🚿</div><div class="inside" id="inside"></div><div class="tool" id="tool"></div></div><div class="panel"><div class="progress"><i id="fill"></i></div><div class="buttons" id="buttons"></div><div class="hint" id="hint"></div></div></section></main><div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
(()=>{
const VERSION='1.3.0';
const eps=[
{id:1,icon:'🚿',title:'Tập 1 · Tắm trước bữa tối',kid:'🧒',left:'⚽',right:'🍚',bad:'🍚',good:'🚿',tool:'🧼',hint:'🧼 ↔️ 🧒',inside:'🤢',insideLabel:'🦠 🦠 🦠',success:'🧒✨'},
{id:2,icon:'👐',title:'Tập 2 · Rửa tay trước khi ăn',kid:'🧒',left:'🧸',right:'🥪',bad:'🥪',good:'🚰',tool:'🧼',hint:'🧼 ↔️ 👐',inside:'🤢',insideLabel:'🦠 🦠 🦠',success:'👐✨'},
{id:3,icon:'🪥',title:'Tập 3 · Đánh răng trước khi ngủ',kid:'😁',left:'🍬',right:'🛏️',bad:'🛏️',good:'🪥',tool:'🪥',hint:'🪥 ↔️ 😁',inside:'🦷',insideLabel:'🦠 ⚡ 🦠',success:'😁✨'},
{id:4,icon:'🤧',title:'Tập 4 · Che miệng khi ho/hắt hơi',kid:'🤧',left:'🧒',right:'🧒',bad:'💨',good:'💪',tool:'💪',hint:'💪 ➜ 🤧',inside:'😷',insideLabel:'🦠 💨 🦠',success:'🙂✨'},
{id:5,icon:'🍪',title:'Tập 5 · Không ăn đồ rơi xuống đất',kid:'🧒',left:'🍪',right:'🗑️',bad:'🍪',good:'🗑️',tool:'🗑️',hint:'🍪 ➜ 🗑️',inside:'🤢',insideLabel:'🦠 🦠 🦠',success:'🍎✨'},
{id:6,icon:'✂️',title:'Tập 6 · Giữ móng tay sạch',kid:'🖐️',left:'🪴',right:'🍎',bad:'🍎',good:'✂️',tool:'✂️',hint:'✂️ ↔️ 🖐️',inside:'🤢',insideLabel:'🦠 🦠 🦠',success:'🖐️✨'}
];
const $=s=>document.querySelector(s),stage=$('#stage'),world=$('#world'),title=$('#title'),kid=$('#kid'),left=$('#leftProp'),right=$('#rightProp'),tool=$('#tool'),water=$('#water'),inside=$('#inside'),fill=$('#fill'),buttons=$('#buttons'),hint=$('#hint'),overlay=$('#overlay'),card=$('#card');let ep=eps[0],progress=0,drag=false,pid=null,last=0,busy=false;
const btn=(t,c,f)=>{const b=document.createElement('button');b.type='button';b.className='btn '+(c||'');b.textContent=t;b.onclick=f;return b};const actions=(...a)=>buttons.replaceChildren(...a);
function resetWorld(){busy=false;progress=0;fill.style.width='0';world.classList.remove('clean');tool.classList.remove('show','dragging');tool.style.left='8%';tool.style.top='auto';tool.style.bottom='8%';water.classList.remove('on');inside.classList.remove('show');inside.innerHTML='';document.querySelectorAll('.fly,.bubble').forEach(x=>x.remove());kid.textContent=ep.kid;left.textContent=ep.left;right.textContent=ep.right;document.querySelectorAll('.germ,.dirt').forEach(x=>{x.style.display='block';x.style.opacity='1'});hint.textContent='👀  ➜  ?';actions(btn(ep.bad,'bad',badChoice),btn(ep.good,'good',goodChoice))}
function choose(id){ep=eps.find(e=>e.id===id)||eps[0];title.textContent=ep.title;resetWorld();overlay.classList.remove('show')}
function flyGerms(targetEl,next){busy=true;const sr=stage.getBoundingClientRect(),kr=kid.getBoundingClientRect(),tr=targetEl.getBoundingClientRect();let done=0;for(let i=0;i<4;i++){const g=document.createElement('span');g.className='fly';g.textContent='🦠';g.style.left=(kr.left-sr.left+45+i*13)+'px';g.style.top=(kr.top-sr.top+55+i*18)+'px';stage.append(g);requestAnimationFrame(()=>{g.style.left=(tr.left-sr.left+15+i*6)+'px';g.style.top=(tr.top-sr.top+15+i*5)+'px';g.style.transform='scale(.55) rotate(35deg)'});setTimeout(()=>{g.remove();if(++done===4)next&&next()},1100)}}
function badChoice(){if(busy)return;actions();hint.textContent='🦠 ➜ '+ep.bad;flyGerms(right,()=>{setTimeout(()=>showInside(),250)})}
function showInside(){inside.innerHTML=`<div class="bodyIcon">${ep.inside}</div><div class="insideGerms">${ep.insideLabel}</div>`;inside.classList.add('show');hint.textContent='⚠️ 🦠';setTimeout(()=>{inside.classList.remove('show');busy=false;hint.textContent=ep.hint;actions(btn(ep.good,'good',goodChoice))},2200)}
function goodChoice(){if(busy)return;progress=8;fill.style.width='8%';tool.classList.add('show');water.classList.add('on');hint.textContent=ep.hint;actions(btn('↻','',()=>choose(ep.id)))}
function bubbleAt(x,y){const b=document.createElement('span');b.className='bubble';b.textContent=ep.id===3?'✨':'🫧';b.style.left=x+'px';b.style.top=y+'px';world.append(b);requestAnimationFrame(()=>{b.style.top=(y-60)+'px';b.style.opacity='0'});setTimeout(()=>b.remove(),780)}
function scrub(cx,cy){const wr=world.getBoundingClientRect(),kr=kid.getBoundingClientRect(),x=cx-wr.left,y=cy-wr.top;tool.style.left=(x-34)+'px';tool.style.top=(y-28)+'px';tool.style.bottom='auto';if(cx>kr.left-45&&cx<kr.right+45&&cy>kr.top-45&&cy<kr.bottom+45){const now=performance.now();if(now-last>45){progress=Math.min(100,progress+3);fill.style.width=progress+'%';bubbleAt(x,y);last=now;if(progress>=100)cleanFinish()}}}
tool.onpointerdown=e=>{if(!tool.classList.contains('show'))return;drag=true;pid=e.pointerId;tool.setPointerCapture?.(pid);tool.classList.add('dragging');scrub(e.clientX,e.clientY);e.preventDefault()};tool.onpointermove=e=>{if(drag&&e.pointerId===pid){scrub(e.clientX,e.clientY);e.preventDefault()}};const release=()=>{drag=false;pid=null;tool.classList.remove('dragging')};tool.onpointerup=release;tool.onpointercancel=release;
function cleanFinish(){if(busy)return;busy=true;tool.classList.remove('show');world.classList.add('clean');hint.textContent='🧼 + 🚿 ➜ 🦠⬇️';const sr=stage.getBoundingClientRect(),kr=kid.getBoundingClientRect();for(let i=0;i<7;i++){const g=document.createElement('span');g.className='fly';g.textContent='🦠';g.style.left=(kr.left-sr.left+25+Math.random()*90)+'px';g.style.top=(kr.top-sr.top+55+Math.random()*120)+'px';stage.append(g);setTimeout(()=>{g.style.top=(stage.clientHeight-170)+'px';g.style.left=(stage.clientWidth/2-20+Math.random()*40)+'px';g.style.transform='scale(.25) rotate(180deg)';g.style.opacity='0'},80+i*80);setTimeout(()=>g.remove(),1250+i*80)}setTimeout(()=>{water.classList.remove('on');kid.textContent=ep.success;fill.style.width='100%';hint.innerHTML='<span class="stars">⭐ ⭐ ⭐</span>';actions(btn('➡️','primary',()=>choose(ep.id===eps.length?1:ep.id+1)),btn('☰','',menu));busy=false},1400)}
function menu(){card.innerHTML=`<div class="episodes">${eps.map(e=>`<button class="ep ${e.id===ep.id?'active':''}" data-id="${e.id}"><span>${e.icon}</span>${e.id}</button>`).join('')}</div><button class="close" id="close">✕</button>`;overlay.classList.add('show');card.querySelectorAll('.ep').forEach(b=>b.onclick=()=>choose(+b.dataset.id));$('#close').onclick=()=>overlay.classList.remove('show')}
$('#menuBtn').onclick=menu;overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};choose(1);
})();
</script></body></html>
