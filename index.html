<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Clean Kids · v1.2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#bff0ff,#fff4bd);color:#17324a;min-height:100dvh}.app{width:min(1180px,100%);margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:1000;font-size:clamp(25px,4vw,42px);color:#1799e5;text-shadow:0 3px #fff}.logo b{color:#ff9d00}.ver{font-size:11px;color:#667}.menuBtn{border:0;border-radius:16px;background:#7b55d9;color:#fff;padding:10px 15px;font-weight:900;font-size:18px}.stage{margin-top:8px;min-height:calc(100dvh - 76px);background:#ffffffd9;border:4px solid white;border-radius:28px;box-shadow:0 14px 38px #2c66852d;padding:12px;overflow:hidden}.title{text-align:center;background:#8055d8;color:white;border-radius:18px;padding:8px;font-weight:1000;font-size:clamp(18px,3vw,27px)}.story{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.frame{position:relative;min-height:310px;border-radius:22px;border:4px solid #fff;box-shadow:0 7px 18px #0002;overflow:hidden;background:linear-gradient(#dff6ff,#fff5d8);display:flex;align-items:center;justify-content:center}.frame.bad{background:linear-gradient(#f8d2c6,#ffe3cc)}.frame.good{background:linear-gradient(#dff8ff,#eaffdf)}.num{position:absolute;left:8px;bottom:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ec4d48;color:#fff;font-size:22px;font-weight:1000;border:3px solid #fff}.good .num{background:#3dbb54}.sceneEmoji{font-size:clamp(80px,10vw,145px);filter:drop-shadow(0 7px 5px #0002);z-index:2}.mini{position:absolute;font-size:30px}.dirt{position:absolute;font-size:28px}.d1{left:18%;top:22%}.d2{right:15%;top:28%}.d3{left:24%;bottom:22%}.germ{position:absolute;font-size:30px;animation:bob .65s alternate infinite}.g1{left:12%;top:13%}.g2{right:10%;top:22%;animation-delay:.2s}.g3{left:18%;bottom:14%;animation-delay:.4s}.g4{right:16%;bottom:18%;animation-delay:.1s}@keyframes bob{to{transform:translateY(-9px) rotate(8deg)}}.arrow{position:absolute;right:-15px;z-index:20;top:45%;font-size:42px;filter:drop-shadow(0 2px #fff)}.caption{position:absolute;bottom:0;left:0;right:0;padding:7px 4px;text-align:center;background:#e84f49;color:#fff;font-weight:1000;font-size:14px}.good .caption{background:#38aa4d}.lower{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;margin-top:10px}.demo,.play{border-radius:22px;background:#fff;border:4px solid #fff;box-shadow:0 7px 18px #0002;padding:10px;min-height:190px}.demoTitle,.playTitle{text-align:center;font-weight:1000;font-size:18px}.washDemo{height:135px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:55px}.washDemo .bubbleWrap{position:relative}.washDemo .bubbleWrap:after{content:'🫧🫧🫧';position:absolute;left:-12px;top:-30px;font-size:24px}.playArea{position:relative;height:135px;background:linear-gradient(#dff6ff,#eefbe8);border-radius:18px;overflow:hidden}.target{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:95px}.tool{position:absolute;left:7%;bottom:12px;font-size:48px;background:#fff;border:4px solid #fff;border-radius:18px;padding:5px 10px;box-shadow:0 6px 14px #0002;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:20}.progress{position:absolute;left:8%;right:8%;top:8px;height:15px;border-radius:99px;background:#d6e6e8;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fbaff,#62d97f);transition:.15s}.playGerms span{position:absolute;font-size:24px;animation:bob .5s alternate infinite}.playGerms span:nth-child(1){left:33%;top:28%}.playGerms span:nth-child(2){right:32%;top:35%}.playGerms span:nth-child(3){left:40%;bottom:18%}.spark{position:absolute;font-size:22px;pointer-events:none;transition:.7s;z-index:30}.doneStars{text-align:center;font-size:42px;margin-top:6px}.episodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ep{border:0;border-radius:18px;padding:14px;background:#eef8fb;font:inherit;font-weight:900}.ep span{display:block;font-size:44px}.overlay{position:fixed;inset:0;background:#16324a66;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.overlay.show{display:flex}.card{width:min(700px,96%);background:#fff;border-radius:26px;padding:18px;max-height:90dvh;overflow:auto}.close{display:block;margin:14px auto 0;border:0;border-radius:16px;padding:12px 18px;background:#7b55d9;color:#fff;font-weight:900;font-size:18px}@media(max-width:800px){.story{grid-template-columns:1fr 1fr}.frame{min-height:230px}.story .frame:nth-child(5){grid-column:1/-1}.arrow{display:none}.lower{grid-template-columns:1fr}.episodes{grid-template-columns:1fr 1fr}}@media(max-width:520px){.app{padding:0}.stage{border-left:0;border-right:0;border-bottom:0;border-radius:22px 22px 0 0}.top{padding:8px}.story{grid-template-columns:1fr}.story .frame:nth-child(5){grid-column:auto}.frame{min-height:210px}.caption{font-size:13px}.sceneEmoji{font-size:100px}.episodes{grid-template-columns:1fr}}
</style></head>
<body><main class="app"><div class="top"><div class="logo">CLEAN <b>KIDS</b> <small class="ver">v1.2.0</small></div><button class="menuBtn" id="menuBtn">☰</button></div><section class="stage"><div class="title" id="title"></div><div class="story" id="story"></div><div class="lower"><div class="demo"><div class="demoTitle">🧼 ➜ 🫧 ➜ 🚿 ➜ ✨</div><div class="washDemo" id="washDemo"></div></div><div class="play"><div class="playTitle" id="playTitle"></div><div class="playArea" id="playArea"><div class="progress"><i id="fill"></i></div><div class="target" id="target"></div><div class="playGerms" id="playGerms"><span>🦠</span><span>🦠</span><span>🦠</span></div><div class="tool" id="tool"></div></div><div class="doneStars" id="doneStars"></div></div></div></section></main><div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
(()=>{
const VERSION='1.2.0';
const eps=[
{id:1,icon:'🚿',title:'Tập 1 · Tắm trước bữa tối',frames:[['🧒','🟤','🦠','BẨN'],['🧒','🍚','🦠','ĂN'],['🤢','🫃','🦠','ĐAU BỤNG'],['🧒','🚿','🧼','TẮM'],['🧒','✨','✅','SẠCH']],tool:'🧼',target:'🧒',demo:['🦠','🫧','🚿','✨'],play:'CHÀ XÀ PHÒNG'},
{id:2,icon:'👐',title:'Tập 2 · Rửa tay trước khi ăn',frames:[['👐','🧸','🦠','TAY BẨN'],['👐','🥪','🦠','CẦM ĐỒ ĂN'],['🤢','🫃','🦠','MẦM BỆNH'],['👐','🚰','🧼','RỬA TAY'],['👐','✨','✅','TAY SẠCH']],tool:'🧼',target:'👐',demo:['🦠','🫧','🚰','✨'],play:'CHÀ TAY'},
{id:3,icon:'🪥',title:'Tập 3 · Đánh răng trước khi ngủ',frames:[['😁','🍬','🦠','ĂN NGỌT'],['🦷','🦠','🍬','MẢNG BÁM'],['😣','🦷','⚡','SÂU RĂNG'],['😁','🪥','🫧','ĐÁNH RĂNG'],['😁','✨','✅','RĂNG SẠCH']],tool:'🪥',target:'😁',demo:['🦠','🪥','🫧','✨'],play:'CHẢI RĂNG'},
{id:4,icon:'🤧',title:'Tập 4 · Che miệng khi ho/hắt hơi',frames:[['🤧','💨','🦠','HẮT HƠI'],['💨','🦠','➡️','GIỌT BẮN'],['🧒','🦠','😷','LÂY SANG BẠN'],['🤧','💪','✅','CHE KHUỶU TAY'],['🙂','✨','✅','AN TOÀN HƠN']],tool:'💪',target:'🤧',demo:['🦠','💨','💪','✅'],play:'CHE MIỆNG'},
{id:5,icon:'🍪',title:'Tập 5 · Không ăn đồ rơi xuống đất',frames:[['🍪','⬇️','🟫','RƠI XUỐNG SÀN'],['🍪','🦠','🟫','BÁM BẨN'],['🤢','🫃','🦠','ĐAU BỤNG'],['🍪','➡️','🗑️','BỎ ĐI'],['🍎','✨','✅','ĂN ĐỒ SẠCH']],tool:'🗑️',target:'🍪',demo:['🍪','🦠','🗑️','✅'],play:'BỎ VÀO THÙNG'},
{id:6,icon:'✂️',title:'Tập 6 · Giữ móng tay sạch',frames:[['🖐️','🟤','🦠','MÓNG BẨN'],['🖐️','🍎','🦠','CẦM ĐỒ ĂN'],['🤢','🫃','🦠','MẦM BỆNH'],['🖐️','✂️','🧼','CẮT & RỬA'],['🖐️','✨','✅','MÓNG SẠCH']],tool:'✂️',target:'🖐️',demo:['🦠','✂️','🧼','✨'],play:'LÀM SẠCH MÓNG'}
];
const $=s=>document.querySelector(s),title=$('#title'),story=$('#story'),washDemo=$('#washDemo'),target=$('#target'),tool=$('#tool'),fill=$('#fill'),playGerms=$('#playGerms'),doneStars=$('#doneStars'),playTitle=$('#playTitle'),overlay=$('#overlay'),card=$('#card');let ep=eps[0],progress=0,drag=false,pid=null,last=0;
function renderFrames(){story.innerHTML=ep.frames.map((f,i)=>`<div class="frame ${i<3?'bad':'good'}"><div class="num">${i+1}</div><div class="sceneEmoji">${f[0]}</div><span class="mini" style="right:15%;top:16%">${f[1]}</span><span class="germ g1">${i===4?'✨':f[2]}</span><span class="germ g2">${i<3?'🦠':'🫧'}</span>${i===0?'<span class="dirt d1">🟤</span><span class="dirt d2">🟤</span>':''}<div class="caption">${f[3]}</div>${i<4?'<div class="arrow">➡️</div>':''}</div>`).join('')}
function choose(id){ep=eps.find(e=>e.id===id)||eps[0];title.textContent=ep.title;renderFrames();washDemo.innerHTML=ep.demo.map((x,i)=>`<span>${x}</span>${i<ep.demo.length-1?'<b>➡️</b>':''}`).join('');target.textContent=ep.target;tool.textContent=ep.tool;playTitle.textContent=ep.play;progress=0;fill.style.width='0';playGerms.style.opacity='1';doneStars.textContent='';tool.style.display='block';tool.style.left='7%';tool.style.top='auto';tool.style.bottom='12px';overlay.classList.remove('show')}
function spark(x,y,ch='🫧'){const s=document.createElement('i');s.className='spark';s.textContent=ch;s.style.left=x+'px';s.style.top=y+'px';$('#playArea').append(s);requestAnimationFrame(()=>{s.style.top=(y-55)+'px';s.style.opacity='0'});setTimeout(()=>s.remove(),720)}
function scrub(cx,cy){const ar=$('#playArea').getBoundingClientRect(),tr=target.getBoundingClientRect(),x=cx-ar.left,y=cy-ar.top;tool.style.left=(x-32)+'px';tool.style.top=(y-28)+'px';tool.style.bottom='auto';if(cx>tr.left-35&&cx<tr.right+35&&cy>tr.top-35&&cy<tr.bottom+35){const now=performance.now();if(now-last>45){progress=Math.min(100,progress+3);fill.style.width=progress+'%';spark(x,y,ep.id===3?'✨':'🫧');last=now;if(progress>=100)complete()}}}
tool.addEventListener('pointerdown',e=>{drag=true;pid=e.pointerId;tool.setPointerCapture?.(pid);scrub(e.clientX,e.clientY);e.preventDefault()});tool.addEventListener('pointermove',e=>{if(drag&&e.pointerId===pid){scrub(e.clientX,e.clientY);e.preventDefault()}});const release=()=>{drag=false;pid=null};tool.addEventListener('pointerup',release);tool.addEventListener('pointercancel',release);
function complete(){tool.style.display='none';playGerms.style.opacity='0';doneStars.textContent='⭐ ⭐ ⭐';for(let i=0;i<12;i++)setTimeout(()=>spark(40+Math.random()*($('#playArea').clientWidth-80),55+Math.random()*55,'✨'),i*55)}
function menu(){card.innerHTML=`<h2 style="text-align:center">🫧</h2><div class="episodes">${eps.map(e=>`<button class="ep" data-id="${e.id}"><span>${e.icon}</span>${e.id}</button>`).join('')}</div><button class="close" id="close">✕</button>`;overlay.classList.add('show');card.querySelectorAll('.ep').forEach(b=>b.onclick=()=>choose(+b.dataset.id));$('#close').onclick=()=>overlay.classList.remove('show')}
$('#menuBtn').onclick=menu;overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};choose(1);
})();
</script></body></html>
